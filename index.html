<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Double Move — Crew Schedule</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #0d0f1a;
      --card-bg: #151929;
      --card-border: #1e2440;
      --purple: #7b5ea7;
      --orange: #f97316;
      --green: #22c55e;
      --text: #e8eaf6;
      --muted: #6b7280;
      --selected-border: #22c55e;
      --unselected-bg: #1a1f35;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: -40%;
      right: -20%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(123, 94, 167, 0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      bottom: -20%;
      left: -10%;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(249, 115, 22, 0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 480px;
      margin: 0 auto;
      padding: 0 0 120px 0;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 20px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      background: rgba(13, 15, 26, 0.8);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--purple) 0%, var(--orange) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 14px;
      color: white;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 16px rgba(123, 94, 167, 0.4);
    }

    .header-title {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 16px;
      color: var(--text);
    }

    .header-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 1px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2a3060, #1a2050);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      border: 2px solid rgba(123, 94, 167, 0.4);
      position: relative;
    }

    .avatar-dot {
      position: absolute;
      bottom: 1px;
      right: 1px;
      width: 10px;
      height: 10px;
      background: var(--green);
      border-radius: 50%;
      border: 2px solid var(--bg);
    }

    .content {
      padding: 24px 20px 0;
      animation: contentIn 0.4s ease 0.1s both;
    }

    @keyframes contentIn {
      from {
        opacity: 0;
        transform: translateY(16px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 20px;
      color: var(--text);
      margin-bottom: 20px;
    }

    .week-label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .days-grid {
      display: grid;
      gap: 8px;
      margin-bottom: 28px;
    }

    .day-card {
      background: var(--unselected-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 16px;
      padding: 10px 4px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      user-select: none;
      position: relative;
      overflow: hidden;
    }

    .day-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(34, 197, 94, 0.08), rgba(34, 197, 94, 0.02));
      opacity: 0;
      transition: opacity 0.2s;
    }

    .day-card.selected {
      border-color: var(--selected-border);
      background: rgba(34, 197, 94, 0.06);
      box-shadow: 0 0 0 1px rgba(34, 197, 94, 0.2), 0 4px 20px rgba(34, 197, 94, 0.12);
      transform: translateY(-1px);
    }

    .day-card.selected::before {
      opacity: 1;
    }

    .day-card:active {
      transform: scale(0.94);
    }

    .day-name {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 11px;
      color: var(--muted);
      transition: color 0.2s;
    }

    .day-card.selected .day-name {
      color: var(--text);
    }

    .day-date {
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      font-size: 15px;
      color: var(--text);
      line-height: 1;
    }

    .day-check {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      border: 1.5px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      margin-top: 2px;
    }

    .day-card.selected .day-check {
      background: var(--green);
      border-color: var(--green);
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.5);
    }

    .checkmark {
      opacity: 0;
      transform: scale(0.5);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .day-card.selected .checkmark {
      opacity: 1;
      transform: scale(1);
    }

    .summary-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 18px 20px;
      margin-bottom: 20px;
    }

    .summary-label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .summary-days {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 32px;
      align-items: center;
    }

    .summary-tag {
      background: linear-gradient(135deg, rgba(123, 94, 167, 0.3), rgba(249, 115, 22, 0.2));
      border: 1px solid rgba(123, 94, 167, 0.4);
      border-radius: 8px;
      padding: 5px 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      animation: tagIn 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes tagIn {
      from {
        transform: scale(0.7);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .summary-empty {
      font-size: 13px;
      color: var(--muted);
      font-style: italic;
    }

    .save-btn-wrap {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px 20px 28px;
      background: linear-gradient(to top, var(--bg) 70%, transparent);
      z-index: 10;
    }

    .save-btn {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 18px;
      background: linear-gradient(135deg, #5b3fa0 0%, #7b5ea7 40%, #f97316 100%);
      color: white;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 17px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
      box-shadow: 0 8px 32px rgba(123, 94, 167, 0.4), 0 2px 8px rgba(249, 115, 22, 0.2);
      position: relative;
      overflow: hidden;
    }

    .save-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), transparent);
    }

    .save-btn:active {
      transform: scale(0.97);
    }

    .save-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(13, 15, 26, 0.97);
      z-index: 100;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      padding: 40px 32px;
      text-align: center;
    }

    .overlay.show {
      display: flex;
    }

    .overlay-icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s both;
    }

    .overlay-icon.green {
      background: linear-gradient(135deg, rgba(34, 197, 94, 0.2), rgba(34, 197, 94, 0.05));
      border: 2px solid var(--green);
      box-shadow: 0 0 40px rgba(34, 197, 94, 0.3);
    }

    .overlay-icon.purple {
      background: linear-gradient(135deg, rgba(123, 94, 167, 0.2), rgba(123, 94, 167, 0.05));
      border: 2px solid var(--purple);
      box-shadow: 0 0 40px rgba(123, 94, 167, 0.3);
    }

    @keyframes popIn {
      from {
        transform: scale(0.5);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .overlay-title {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 22px;
      color: var(--text);
      animation: slideUp 0.4s ease 0.2s both;
    }

    .overlay-sub {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.6;
      max-width: 280px;
      animation: slideUp 0.4s ease 0.3s both;
    }

    @keyframes slideUp {
      from {
        transform: translateY(10px);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <div class="header-left">
        <div class="logo">DM</div>
        <div>
          <div class="header-title">DOUBLE MOVE</div>
          <div class="header-sub">Crew Schedule</div>
        </div>
      </div>
      <div class="avatar">
        <span id="avatarEmoji">👤</span>
        <div class="avatar-dot"></div>
      </div>
    </div>

    <div class="content">
      <div class="section-title">
        <span class="icon">🗓️</span>
        <span id="sectionTitle">Available this week</span>
      </div>
      <div class="week-label" id="weekLabel">Loading...</div>
      <div class="days-grid" id="daysGrid"></div>
      <div class="summary-card">
        <div class="summary-label">Selected days</div>
        <div class="summary-days" id="summaryDays">
          <span class="summary-empty">No days selected yet</span>
        </div>
      </div>
    </div>
  </div>

  <div class="save-btn-wrap">
    <button class="save-btn" id="saveBtn" disabled onclick="saveSchedule()">
      <span>📅</span>
      <span>Save Schedule</span>
    </button>
  </div>

  <div class="overlay" id="successOverlay">
    <div class="overlay-icon green">✅</div>
    <div class="overlay-title">Schedule Saved!</div>
    <div class="overlay-sub">Your availability has been recorded. See you next week!</div>
  </div>

  <div class="overlay" id="alreadyOverlay">
    <div class="overlay-icon purple">📋</div>
    <div class="overlay-title">Already Submitted</div>
    <div class="overlay-sub">You've already submitted your schedule. See you next Saturday!</div>
  </div>

  <script>
    var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    var DAY_NAMES = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    // JS getDay(): 0=Sun, 1=Mon, 2=Tue, 3=Wed, 4=Thu, 5=Fri, 6=Sat
    var selectedDays = new Set();
    var weekDates = [];
    var weekMonday = null;
    var weekKey = '';

    function getAvailableDates() {
      var today = new Date();
      today.setHours(0, 0, 0, 0);
      var jsDay = today.getDay(); // 0=Sun, 6=Sat

      var dates = [];
      var isSatOrSun = (jsDay === 6 || jsDay === 0);

      if (isSatOrSun) {
        // Sat or Sun → show full next week (Mon–Sun)
        var daysUntilMonday = jsDay === 0 ? 1 : 2; // Sun→+1, Sat→+2
        var monday = new Date(today);
        monday.setDate(today.getDate() + daysUntilMonday);
        weekMonday = monday;
        for (var i = 0; i < 7; i++) {
          var d = new Date(monday);
          d.setDate(monday.getDate() + i);
          dates.push(d);
        }
        document.getElementById('sectionTitle').textContent = 'Available next week';
      } else {
        // Mon–Fri → show remaining days of THIS week (tomorrow up to and including Sat)
        // Find this week's Monday first
        var daysFromMonday = jsDay === 0 ? 6 : jsDay - 1;
        var thisMonday = new Date(today);
        thisMonday.setDate(today.getDate() - daysFromMonday);
        weekMonday = thisMonday;

        // Show days from tomorrow until Saturday (index 0=Mon … 5=Sat)
        var tomorrowIndex = daysFromMonday + 1; // index in Mon-based week
        for (var j = tomorrowIndex; j <= 5; j++) { // 5 = Sat
          var d2 = new Date(thisMonday);
          d2.setDate(thisMonday.getDate() + j);
          dates.push(d2);
        }
        document.getElementById('sectionTitle').textContent = 'Available this week';
      }

      return dates;
    }

    function toLocalISODate(date) {
      var y = date.getFullYear();
      var m = String(date.getMonth() + 1).padStart(2, '0');
      var d = String(date.getDate()).padStart(2, '0');
      return y + '-' + m + '-' + d;
    }

    function getWeekKey() {
      return 'submitted_' + toLocalISODate(weekMonday);
    }

    function hasAlreadySubmitted() {
      try {
        return localStorage.getItem(weekKey) === 'true';
      } catch (e) {
        return false;
      }
    }

    function markAsSubmitted() {
      try {
        localStorage.setItem(weekKey, 'true');
      } catch (e) {}
    }

    function formatWeekLabel(dates) {
      var opts = {
        month: 'short',
        day: 'numeric'
      };
      if (dates.length === 1) {
        return dates[0].toLocaleDateString('en-US', opts);
      }
      return dates[0].toLocaleDateString('en-US', opts) + ' - ' + dates[dates.length - 1].toLocaleDateString('en-US',
        opts);
    }

    function buildGrid(dates) {
      var grid = document.getElementById('daysGrid');
      grid.innerHTML = '';

      // Set grid columns based on number of days
      grid.style.gridTemplateColumns = 'repeat(' + dates.length + ', 1fr)';

      for (var i = 0; i < dates.length; i++) {
        (function (index, date) {
          var jsDay = date.getDay(); // 0=Sun
          var dayIndex = jsDay === 0 ? 6 : jsDay - 1; // convert to Mon=0 index
          var card = document.createElement('div');
          card.className = 'day-card';
          card.innerHTML =
            '<div class="day-name">' + DAY_NAMES[dayIndex] + '</div>' +
            '<div class="day-date">' + date.getDate() + '</div>' +
            '<div class="day-check">' +
            '<svg class="checkmark" width="14" height="14" viewBox="0 0 14 14" fill="none">' +
            '<path d="M2 7L5.5 10.5L12 3.5" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>' +
            '</svg>' +
            '</div>';
          card.addEventListener('click', function () {
            toggleDay(index, card);
          });
          grid.appendChild(card);
        })(i, dates[i]);
      }
    }

    function toggleDay(index, card) {
      if (selectedDays.has(index)) {
        selectedDays.delete(index);
        card.classList.remove('selected');
      } else {
        selectedDays.add(index);
        card.classList.add('selected');
      }
      updateSummary();
      document.getElementById('saveBtn').disabled = selectedDays.size === 0;
    }

    function updateSummary() {
      var container = document.getElementById('summaryDays');
      if (selectedDays.size === 0) {
        container.innerHTML = '<span class="summary-empty">No days selected yet</span>';
        return;
      }
      var sorted = Array.from(selectedDays).sort(function (a, b) {
        return a - b;
      });
      container.innerHTML = sorted.map(function (i) {
        var date = weekDates[i];
        var jsDay = date.getDay();
        var dayIndex = jsDay === 0 ? 6 : jsDay - 1;
        return '<span class="summary-tag">' + DAY_NAMES[dayIndex] + ' ' + date.getDate() + '</span>';
      }).join('');
    }

    function saveSchedule() {
      if (selectedDays.size === 0) return;

      var sorted = Array.from(selectedDays).sort(function (a, b) {
        return a - b;
      });
      var days = sorted.map(function (i) {
        var date = weekDates[i];
        var jsDay = date.getDay();
        var dayIndex = jsDay === 0 ? 6 : jsDay - 1;
        return {
          day: DAY_NAMES[dayIndex],
          date: toLocalISODate(date)
        };
      });

      var user = null;
      if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
        user = tg.initDataUnsafe.user;
      }

      var payload = {
        userId: user ? user.id : null,
        firstName: user ? user.first_name : null,
        username: user ? user.username : null,
        weekStart: toLocalISODate(weekMonday),
        selectedDays: days
      };

      fetch('https://hook.us2.make.com/llj7w39ruqhgj6z4pa6ztppv4oyitxa9', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
      }).catch(function (e) {
        console.error('Webhook error:', e);
      });

      markAsSubmitted();
      document.getElementById('successOverlay').classList.add('show');
      setTimeout(function () {
        if (tg && tg.close) tg.close();
      }, 2000);
    }

    // Init
    weekDates = getAvailableDates();
    weekKey = getWeekKey();
    document.getElementById('weekLabel').textContent = formatWeekLabel(weekDates);
    buildGrid(weekDates);

    if (hasAlreadySubmitted()) {
      document.getElementById('alreadyOverlay').classList.add('show');
    }
  </script>
</body>

</html>
